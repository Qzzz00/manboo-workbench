<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">派活与反馈机制</title><desc id="desc">工作上下文进入事务官，由执行引擎检查动作并选择适配器，把任务交给已接入的 AI；系统读取结果与证据，用户把关并记录产物、修改和反馈，供后续推进使用。投递成功不等于任务完成。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#bdc2c5" stroke-width="1.2"/></marker></defs>
<rect width="760" height="430" rx="6" fill="#080b0c"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="32" y="44" fill="#f1f2f3" font-size="27" font-weight="650" text-anchor="start">任务如何推进</text><rect x="32" y="74" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="140" y="116" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">工作上下文</text><text x="140" y="152" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">任务 · 材料 · 规矩</text><rect x="272" y="74" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="380" y="116" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">事务官</text><text x="380" y="152" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">组织要求与分工</text><rect x="512" y="74" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="620" y="116" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">执行引擎</text><text x="620" y="152" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">动作检查 · 选择通道</text><path d="M248 126H267" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><path d="M488 126H507" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 178V229" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><rect x="512" y="234" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="620" y="276" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">已接入的 AI</text><text x="620" y="312" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">按适配器能力执行</text><rect x="272" y="234" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="380" y="276" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">结果与证据</text><text x="380" y="312" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">读取回复 · 核对状态</text><rect x="32" y="234" width="216" height="104" rx="6" fill="#111516" stroke="#778086"/><text x="140" y="276" fill="#f1f2f3" font-size="25" font-weight="550" text-anchor="middle">把关与记录</text><text x="140" y="312" fill="#bdc2c5" font-size="18" font-weight="400" text-anchor="middle">产物 · 修改 · 用户反馈</text><path d="M512 286H493" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><path d="M272 286H253" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><path d="M32 286H16V126H27" fill="none" stroke="#bdc2c5" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="402" fill="#bdc2c5" font-size="20" font-weight="400" text-anchor="start">记录供下一次推进与反馈验证使用；投递成功不等于任务完成。</text></g>
</svg>
