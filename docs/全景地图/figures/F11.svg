<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 404" role="img" aria-label="结构:本体与用户层"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="zone"><rect x="30" y="30" width="400" height="305" rx="12"/><text x="42" y="48">本体(统一发版)</text></g><g class="zone"><rect x="470" y="30" width="420" height="305" rx="12"/><text x="482" y="48">用户层(本机自主改动)</text></g><g class="box brain"><rect x="45" y="64" width="370" height="45" rx="8"/><text x="230" y="86.5" style="font-size:13px">大脑 / 壳 / 工人 / 手机 / 展示台</text></g><g class="box "><rect x="45" y="125" width="370" height="45" rx="8"/><text x="230" y="147.5" style="font-size:13px">内置product / 加载容器 / 通用皮肤</text></g><g class="box "><rect x="45" y="186" width="370" height="55" rx="8"/><text x="230" y="195.5" style="font-size:13px">加载口与契约</text><text class="sub" x="230" y="213.5">scan / sync / JS rev + style_rev</text><text class="sub" x="230" y="231.5">模板来源统一 / desired与effective</text></g><g class="box todo"><rect x="45" y="258" width="370" height="48" rx="8"/><text x="230" y="273" style="font-size:13px">个人定制不反写本体</text><text class="sub" x="230" y="291">本体变更走独立实施→验收→合并</text></g><g class="box entry"><rect x="485" y="64" width="390" height="32" rx="8"/><text x="680" y="80" style="font-size:12px">页内六格与网页小组件</text></g><g class="box entry"><rect x="485" y="105" width="390" height="32" rx="8"/><text x="680" y="121" style="font-size:12px">布局ops.json / ops.css与组件style.css</text></g><g class="box entry"><rect x="485" y="146" width="390" height="32" rx="8"/><text x="680" y="162" style="font-size:12px">用户层技能是源,改过不覆盖</text></g><g class="box entry"><rect x="485" y="187" width="390" height="32" rx="8"/><text x="680" y="203" style="font-size:12px">已有index/manifest/style定制保留</text></g><g class="box entry"><rect x="485" y="228" width="390" height="32" rx="8"/><text x="680" y="244" style="font-size:12px">.seeded / .styled防删后重启复生</text></g><g class="box entry"><rect x="485" y="269" width="390" height="32" rx="8"/><text x="680" y="285" style="font-size:12px">采集器/偏好事实仍在原来的多处</text></g><path class="dash" d="M430 210 L470 210" fill="none" marker-end="url(#arr)"/><text class="note" x="40" y="360" text-anchor="start" style="font-size:12px">.styled缺席的旧目录首轮,只补starter同名且用户组件目录仍在、style.css缺席的样式;已有index/manifest/style不覆盖,不核原件指纹。精确manif</text><text class="note" x="40" y="376" text-anchor="start" style="font-size:12px">est/index指纹仅用于旧files内存归ops。正确starter升级:14组computed相等、两格像素差0,整图仍有动态差。</text></g></svg>