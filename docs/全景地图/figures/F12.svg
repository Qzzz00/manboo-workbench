<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" role="img" aria-label="流程:早报怎么拼"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box "><rect x="40" y="30" width="300" height="46" rx="8"/><text x="190" y="53" style="font-size:13px">触发</text></g><text class="sub" x="360" y="50" text-anchor="start" style="font-size:12px">当天第一次露面(06:00 后)/ 到了时刻 / 手点「现在出一份」</text><path class="" d="M190 76 L190 94" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="98" width="300" height="46" rx="8"/><text x="190" y="121" style="font-size:13px">收各家记忆</text></g><text class="sub" x="360" y="118" text-anchor="start" style="font-size:12px">只收不并</text><path class="" d="M190 144 L190 162" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="166" width="300" height="46" rx="8"/><text x="190" y="189" style="font-size:13px">数据复盘 · 搜资讯 · 对运营目标 · 核进度</text></g><text class="sub" x="360" y="186" text-anchor="start" style="font-size:12px">资讯经中转搜博查、以 AIHOT 日报为底;进度按证据</text><path class="" d="M190 212 L190 230" fill="none" marker-end="url(#arr)"/><g class="box brain"><rect x="40" y="234" width="300" height="46" rx="8"/><text x="190" y="257" style="font-size:13px">出四段</text></g><text class="sub" x="360" y="254" text-anchor="start" style="font-size:12px">程序把昨天的 Agent 任务判成五档;模型只并条与措辞,只许引编号</text><path class="" d="M190 280 L190 298" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="302" width="300" height="46" rx="8"/><text x="190" y="325" style="font-size:13px">拼报文</text></g><text class="sub" x="360" y="322" text-anchor="start" style="font-size:12px">四段 → 三句 → 今天的会 → 进度 → 目标 → 资讯 → 「今天先做哪件?」</text><path class="" d="M190 348 L190 366" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="370" width="300" height="46" rx="8"/><text x="190" y="393" style="font-size:13px">开一条 DSH 会话</text></g><text class="sub" x="360" y="390" text-anchor="start" style="font-size:12px">第一条消息就是报文;模型只回「等你定」</text><path class="" d="M190 416 L190 434" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="438" width="300" height="46" rx="8"/><text x="190" y="461" style="font-size:13px">她在哪看</text></g><text class="sub" x="360" y="458" text-anchor="start" style="font-size:12px">电脑「事务官交给我」最前;手机「汇报」页;默认只通知不响铃</text><text class="note" x="40" y="510" text-anchor="start" style="font-size:12px">真机:10-13 用演示数据出过四段;下班例程 09-24 起天天有提交;日结与快报没有真机记录</text></g></svg>