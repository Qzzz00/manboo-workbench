<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 492" role="img" aria-label="阶段机:一件委托从待派到交付"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box "><rect x="50" y="70" width="130" height="44" rx="8"/><text x="115" y="92" style="font-size:13px">待派 ready</text></g><g class="box "><rect x="240" y="70" width="130" height="44" rx="8"/><text x="305" y="92" style="font-size:13px">派出中 dispatching</text></g><g class="box "><rect x="430" y="70" width="130" height="44" rx="8"/><text x="495" y="92" style="font-size:13px">在跑 running</text></g><g class="box "><rect x="620" y="70" width="130" height="44" rx="8"/><text x="685" y="92" style="font-size:13px">核验中 verifying</text></g><g class="box brain"><rect x="780" y="70" width="130" height="44" rx="8"/><text x="845" y="92" style="font-size:13px">交付 delivered</text></g><g class="box "><rect x="430" y="190" width="130" height="44" rx="8"/><text x="495" y="212" style="font-size:13px">对账 reconciling</text></g><g class="box "><rect x="620" y="190" width="130" height="44" rx="8"/><text x="685" y="212" style="font-size:13px">恢复中 recovering</text></g><g class="box entry"><rect x="240" y="310" width="130" height="44" rx="8"/><text x="305" y="332" style="font-size:13px">等本人 waiting_user</text></g><g class="box brain"><rect x="780" y="310" width="130" height="44" rx="8"/><text x="845" y="332" style="font-size:13px">取消 canceled</text></g><path class="" d="M180 92 L238 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="121.4" y="50" width="177.2" height="17" rx="3"/><text class="lbl" x="210" y="60" text-anchor="middle" style="font-size:11px">dispatch_prepared · 派前写账</text><path class="" d="M370 92 L428 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="373.44" y="50" width="53.12" height="17" rx="3"/><text class="lbl" x="400" y="60" text-anchor="middle" style="font-size:11px">started</text><path class="" d="M560 92 L618 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="529.12" y="50" width="121.76" height="17" rx="3"/><text class="lbl" x="590" y="60" text-anchor="middle" style="font-size:11px">returned(交回≠交付)</text><path class="" d="M750 92 L778 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="701.48" y="50" width="127.04" height="17" rx="3"/><text class="lbl" x="765" y="60" text-anchor="middle" style="font-size:11px">verification_passed</text><path class="" d="M260 70 L260 44 L350 44 L350 68" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="202.98" y="28" width="204.04" height="17" rx="3"/><text class="lbl" x="305" y="38" text-anchor="middle" style="font-size:11px">attempt_failed → 换下一只(候选表)</text><path class="" d="M495 114 L495 188" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="483.8" y="140" width="102.4" height="17" rx="3"/><text class="lbl" x="535" y="150" text-anchor="middle" style="font-size:11px">outcome_unclear</text><path class="dash" d="M450 190 L450 116" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="262.26" y="155" width="259.48" height="17" rx="3"/><text class="lbl" x="392" y="165" text-anchor="middle" style="font-size:11px">started / returned 对上当前 attempt 即接回</text><path class="dot" d="M560 220 L618 220" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="605.02" y="238" width="189.96" height="17" rx="3"/><text class="lbl" x="700" y="248" text-anchor="middle" style="font-size:11px">读不到:「完成」裁决 待实现(批 3)</text><path class="" d="M640 70 L640 44 L730 44 L730 68" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="561.86" y="28" width="246.28" height="17" rx="3"/><text class="lbl" x="685" y="38" text-anchor="middle" style="font-size:11px">verification_unknown · wakeAt 60 秒再核</text><path class="" d="M685 114 L685 188" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="666.48" y="140" width="127.04" height="17" rx="3"/><text class="lbl" x="730" y="150" text-anchor="middle" style="font-size:11px">verification_failed</text><path class="dash" d="M640 234 L640 262 L355 262 L355 116" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="303.22" y="248" width="273.56" height="17" rx="3"/><text class="lbl" x="440" y="258" text-anchor="middle" style="font-size:11px">repair 退修重派(派发口同一只;被闸挡不挂 doing)</text><path class="" d="M305 114 L305 308" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="191.32" y="190" width="227.36" height="17" rx="3"/><text class="lbl" x="305" y="200" text-anchor="middle" style="font-size:11px">点名那只起跑失败 named_startup_failed</text><path class="" d="M650 234 L650 332 L372 332" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="399.52" y="316" width="200.96" height="17" rx="3"/><text class="lbl" x="500" y="326" text-anchor="middle" style="font-size:11px">repair_give_up / goal_ambiguous</text><path class="dash" d="M305 310 L305 290 L820 290 L820 116" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="405.4" y="276" width="309.2" height="17" rx="3"/><text class="lbl" x="560" y="286" text-anchor="middle" style="font-size:11px">settled_by_human「按通过结掉」= 人判通过(任何非终态)</text><path class="dash" d="M750 226 L845 226 L845 308" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="790.72" y="256" width="108.56" height="17" rx="3"/><text class="lbl" x="845" y="266" text-anchor="middle" style="font-size:11px">cancel_requested</text><g class="box "><rect x="50" y="190" width="130" height="44" rx="8"/><text x="115" y="203" style="font-size:13px">重启接回</text><text class="sub" x="115" y="221">restoreExecution</text></g><path class="dash" d="M180 212 L428 212" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="206.12" y="218" width="187.76" height="17" rx="3"/><text class="lbl" x="300" y="228" text-anchor="middle" style="font-size:11px">next 缺失 / 不可用 → 一律先对账</text><text class="note" x="40" y="380" text-anchor="start" style="font-size:12px">谁提交事实:派发口 dispatchRun.ts(prepared / started / attempt_failed / outcome_unclear / returned);核验交付 taskExecutionDelive</text><text class="note" x="40" y="396" text-anchor="start" style="font-size:12px">ry.ts(verification_* / settled_by_human / cancel_requested / 等本人);重启 tasks.ts unfinishedExecutions → restoreExecution。记</text><text class="note" x="40" y="412" text-anchor="start" style="font-size:12px">录写入只经 taskExecutionStore.compareAndSet(按版本串行)。</text><text class="note" x="40" y="432" text-anchor="start" style="font-size:12px">验证:tests/task-execution{,-store,-entrances,-dispatch,-delivery}.test.ts、dispatch-run-retry-1029、dispatch-send-hub-1029;合</text><text class="note" x="40" y="448" text-anchor="start" style="font-size:12px">入闸 367/367(第 2 步)· 211/213(第 3 步,两条时序抖动单跑绿)· 244/244(第 4 步);意图回归集 38/38 × 3。真机:0.4.189 三句 3 秒 + 随手记</text><text class="note" x="40" y="464" text-anchor="start" style="font-size:12px">一句到热装(10-29 14:0x);0.4.190–192 真机三类未点(桌面控制被拒)。</text></g></svg>