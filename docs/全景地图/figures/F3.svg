<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-label="流程:主路五段"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box "><rect x="40" y="30" width="160" height="96" rx="8"/><text x="120" y="51" style="font-size:14px">① 输入</text><text class="sub" x="120" y="69">三个入口一条路</text><text class="sub" x="120" y="87">文字 / 按住说话 / 通话</text><text class="sub" x="120" y="105">文件只传路径</text></g><path class="" d="M200 78 L214 78" fill="none" marker-end="url(#arr)"/><text class="sub" x="44" y="148" text-anchor="start" style="font-size:12px">验到哪:码 测 · 真机部分</text><text class="note" x="44" y="168" text-anchor="start" style="font-size:12px">脆:出门那一跳靠公网</text><g class="box brain"><rect x="216" y="30" width="160" height="96" rx="8"/><text x="296" y="51" style="font-size:14px">② 听懂</text><text class="sub" x="296" y="69">先规则后模型</text><text class="sub" x="296" y="87">写死顺序认十来类</text><text class="sub" x="296" y="105">电话后半段另一套</text></g><path class="" d="M376 78 L390 78" fill="none" marker-end="url(#arr)"/><text class="sub" x="220" y="148" text-anchor="start" style="font-size:12px">验到哪:码 测 · 真机 10-1</text><text class="sub" x="220" y="164" text-anchor="start" style="font-size:12px">3 一次</text><text class="note" x="220" y="184" text-anchor="start" style="font-size:12px">脆:契约有部分对照;认话仍</text><text class="note" x="220" y="200" text-anchor="start" style="font-size:12px">分叉</text><g class="box "><rect x="392" y="30" width="160" height="96" rx="8"/><text x="472" y="51" style="font-size:14px">③ 派活</text><text class="sub" x="472" y="69">登记表挑家</text><text class="sub" x="472" y="87">协议&gt;窗口&gt;命令行&gt;接口</text><text class="sub" x="472" y="105">送达分三档记账</text></g><path class="" d="M552 78 L566 78" fill="none" marker-end="url(#arr)"/><text class="sub" x="396" y="148" text-anchor="start" style="font-size:12px">验到哪:码 测 真机</text><text class="note" x="396" y="168" text-anchor="start" style="font-size:12px">脆:壳点窗口没有退路</text><g class="box "><rect x="568" y="30" width="160" height="96" rx="8"/><text x="648" y="51" style="font-size:14px">④ 跟进</text><text class="sub" x="648" y="69">4 秒读一眼</text><text class="sub" x="648" y="87">3 分钟 / 45 分钟判失败</text><text class="sub" x="648" y="105">不重发</text></g><path class="" d="M728 78 L742 78" fill="none" marker-end="url(#arr)"/><text class="sub" x="572" y="148" text-anchor="start" style="font-size:12px">验到哪:码 测 · 短任务真</text><text class="sub" x="572" y="164" text-anchor="start" style="font-size:12px">机</text><text class="note" x="572" y="184" text-anchor="start" style="font-size:12px">脆:按家隔离已做;长任务仍</text><text class="note" x="572" y="200" text-anchor="start" style="font-size:12px">需实测</text><g class="box brain"><rect x="744" y="30" width="160" height="96" rx="8"/><text x="824" y="51" style="font-size:14px">⑤ 反馈</text><text class="sub" x="824" y="69">自查只查规矩</text><text class="sub" x="824" y="87">卡挪「等你确认」</text><text class="sub" x="824" y="105">失败才响铃</text></g><text class="sub" x="748" y="148" text-anchor="start" style="font-size:12px">验到哪:码 测 · 失败来电</text><text class="sub" x="748" y="164" text-anchor="start" style="font-size:12px">真机</text><text class="note" x="748" y="184" text-anchor="start" style="font-size:12px">脆:不判结果对不对;没有推</text><text class="note" x="748" y="200" text-anchor="start" style="font-size:12px">送</text></g></svg>