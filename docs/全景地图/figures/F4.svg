<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 636" role="img" aria-label="流程:听懂的分叉"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box "><rect x="40" y="30" width="330" height="38" rx="8"/><text x="205" y="49" style="font-size:13px">说了「以后都 / 每次 / 别再」</text></g><path class="" d="M370 49 L398 49" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="30" width="460" height="38" rx="8"/><text x="630" y="49" style="font-size:13px">记进规矩表,当场生效</text></g><g class="box "><rect x="40" y="80" width="330" height="38" rx="8"/><text x="205" y="99" style="font-size:13px">像在改布局</text></g><path class="" d="M370 99 L398 99" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="80" width="460" height="38" rx="8"/><text x="630" y="99" style="font-size:13px">先摆确认卡,点了才改</text></g><path class="" d="M60 70 L60 78" fill="none"/><g class="box "><rect x="40" y="130" width="330" height="38" rx="8"/><text x="205" y="149" style="font-size:13px">说的是工作台自己的毛病</text></g><path class="" d="M370 149 L398 149" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="130" width="460" height="38" rx="8"/><text x="630" y="149" style="font-size:13px">只记反馈,不派人(用户机器上)</text></g><path class="" d="M60 120 L60 128" fill="none"/><g class="box "><rect x="40" y="180" width="330" height="38" rx="8"/><text x="205" y="199" style="font-size:13px">问「到哪了」</text></g><path class="" d="M370 199 L398 199" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="180" width="460" height="38" rx="8"/><text x="630" y="199" style="font-size:13px">按证据答进度</text></g><path class="" d="M60 170 L60 178" fill="none"/><g class="box "><rect x="40" y="230" width="330" height="38" rx="8"/><text x="205" y="249" style="font-size:13px">点了「开发一个小工具」</text></g><path class="" d="M370 249 L398 249" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="230" width="460" height="38" rx="8"/><text x="630" y="249" style="font-size:13px">复述原话,点确认后派给能写代码的家</text></g><path class="" d="M60 220 L60 228" fill="none"/><g class="box "><rect x="40" y="280" width="330" height="38" rx="8"/><text x="205" y="299" style="font-size:13px">@某家,或「让 / 派 / 交给 + 家名」</text></g><path class="" d="M370 299 L398 299" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="280" width="460" height="38" rx="8"/><text x="630" y="299" style="font-size:13px">点名派活:「先问我」挂审批,「自动办」直接派</text></g><path class="" d="M60 270 L60 278" fill="none"/><g class="box "><rect x="40" y="330" width="330" height="38" rx="8"/><text x="205" y="349" style="font-size:13px">不超过 40 字、在问、不动手</text></g><path class="" d="M370 349 L398 349" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="330" width="460" height="38" rx="8"/><text x="630" y="349" style="font-size:13px">随手一问:轻量模型当场答</text></g><path class="" d="M60 320 L60 328" fill="none"/><g class="box "><rect x="40" y="380" width="330" height="38" rx="8"/><text x="205" y="399" style="font-size:13px">10 分钟内接着说</text></g><path class="" d="M370 399 L398 399" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="380" width="460" height="38" rx="8"/><text x="630" y="399" style="font-size:13px">并进上一件</text></g><path class="" d="M60 370 L60 378" fill="none"/><g class="box "><rect x="40" y="430" width="330" height="38" rx="8"/><text x="205" y="449" style="font-size:13px">只是记一笔</text></g><path class="" d="M370 449 L398 449" fill="none" marker-end="url(#arr)"/><g class="box entry"><rect x="400" y="430" width="460" height="38" rx="8"/><text x="630" y="449" style="font-size:13px">建卡,不开会话</text></g><path class="" d="M60 420 L60 428" fill="none"/><g class="box brain"><rect x="40" y="480" width="820" height="42" rx="8"/><text x="450" y="501" style="font-size:13px">其余:建一张卡,并开一条事务官的 DSH 会话(一轮模型)</text></g><g class="box "><rect x="40" y="540" width="820" height="58" rx="8"/><text x="450" y="560" style="font-size:13px">电话入口:每句先问同一个「听懂」(最多等 400 毫秒)</text><text class="sub" x="450" y="578">认不出的走通话工人自己的词表,再由工人里的模型自己挑工具;派活工具先过「拿不准才确认」,再打同一条 /butler/item</text></g><text class="note" x="40" y="620" text-anchor="start" style="font-size:12px">前面这几条不确认直接办;点名派活留一句确认。词表分处维护;已有契约对照不等于认话归一。</text></g></svg>