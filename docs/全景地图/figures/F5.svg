<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 654" role="img" aria-label="流程:派活引擎"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box "><rect x="40" y="30" width="360" height="54" rx="8"/><text x="220" y="48" style="font-size:13px">1 认出派给谁</text><text class="sub" x="220" y="66">点名就用;没点名按习惯与规矩表挑</text></g><text class="sub" x="420" y="48" text-anchor="start" style="font-size:12px">候选 = 登记表 agents.json + 本机探到的;不是电话也不是「自动办」档,先等</text><text class="sub" x="420" y="64" text-anchor="start" style="font-size:12px">她点「允许这一次」</text><path class="" d="M220 84 L220 104" fill="none" marker-end="url(#arr)"/><g class="box brain"><rect x="40" y="108" width="360" height="54" rx="8"/><text x="220" y="126" style="font-size:13px">2 挑手</text><text class="sub" x="220" y="144">协议 &gt; 窗口 &gt; 命令行 &gt; 接口</text></g><text class="sub" x="420" y="126" text-anchor="start" style="font-size:12px">写代码只走命令行,动电脑只走窗口;一条都排不上 → 未送,挂「运行失败」</text><path class="" d="M220 162 L220 182" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="186" width="360" height="54" rx="8"/><text x="220" y="204" style="font-size:13px">3 过闸</text><text class="sub" x="220" y="222">收场了不动;限次数、限间隔;锁屏排队</text></g><text class="sub" x="420" y="204" text-anchor="start" style="font-size:12px">计数落盘、六小时过期;可重置这一家</text><path class="" d="M220 240 L220 260" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="264" width="360" height="54" rx="8"/><text x="220" y="282" style="font-size:13px">4 送进去</text><text class="sub" x="220" y="300">壳:开 App → 台前 → 找框 → 打字 → 发送</text></g><text class="sub" x="420" y="282" text-anchor="start" style="font-size:12px">Codex 走协议开线程发一轮;Claude 走 socket;写代码在独立工作区起命令行</text><path class="" d="M220 318 L220 338" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="342" width="360" height="54" rx="8"/><text x="220" y="360" style="font-size:13px">5 核送达</text><text class="sub" x="220" y="378">确证 / 未确证 / 未送</text></g><text class="sub" x="420" y="360" text-anchor="start" style="font-size:12px">协议回执 &gt; 它的记录文件 &gt; 窗里看见我们那句;一行一步记进 jobs.jsonl</text><path class="" d="M220 396 L220 416" fill="none" marker-end="url(#arr)"/><g class="box brain"><rect x="40" y="420" width="360" height="54" rx="8"/><text x="220" y="438" style="font-size:13px">6 盯着收回</text><text class="sub" x="220" y="456">每 4 秒读一眼,不送不点</text></g><text class="sub" x="420" y="438" text-anchor="start" style="font-size:12px">说完 = 不在写且连着两次一样;3 分钟没见记号或 45 分钟没说完 → 运行失败(</text><text class="sub" x="420" y="454" text-anchor="start" style="font-size:12px">不重发)</text><path class="" d="M220 474 L220 494" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="498" width="360" height="54" rx="8"/><text x="220" y="516" style="font-size:13px">7 自查</text><text class="sub" x="220" y="534">只查机械规矩:蓝色、复述交代…</text></g><text class="sub" x="420" y="516" text-anchor="start" style="font-size:12px">没过打回同一对话改一次;再不过挂失败;回答在问她 → 等你输入;自查出错就放行</text><path class="" d="M220 552 L220 572" fill="none" marker-end="url(#arr)"/><g class="box "><rect x="40" y="576" width="360" height="54" rx="8"/><text x="220" y="594" style="font-size:13px">8 结局</text><text class="sub" x="220" y="612">等你确认 / 运行失败 / 等你输入</text></g><text class="sub" x="420" y="594" text-anchor="start" style="font-size:12px">来电规矩:失败与等你输入立刻响;等你确认默认只通知;23 点到 8 点只通知</text></g></svg>