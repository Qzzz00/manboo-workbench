<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-label="时序:做视频"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box lane"><rect x="45" y="16" width="112.857" height="34" rx="6"/><text x="101.429" y="33" style="font-size:13px">你</text></g><line class="life" x1="101.429" y1="50" x2="101.429" y2="526"/><g class="box lane"><rect x="167.857" y="16" width="112.857" height="34" rx="6"/><text x="224.286" y="33" style="font-size:13px">通话工人</text></g><line class="life" x1="224.286" y1="50" x2="224.286" y2="526"/><g class="box lane"><rect x="290.714" y="16" width="112.857" height="34" rx="6"/><text x="347.143" y="33" style="font-size:13px">大脑 8791</text></g><line class="life" x1="347.143" y1="50" x2="347.143" y2="526"/><g class="box lane"><rect x="413.571" y="16" width="112.857" height="34" rx="6"/><text x="470" y="33" style="font-size:13px">壳</text></g><line class="life" x1="470" y1="50" x2="470" y2="526"/><g class="box lane"><rect x="536.429" y="16" width="112.857" height="34" rx="6"/><text x="592.857" y="33" style="font-size:13px">豆包</text></g><line class="life" x1="592.857" y1="50" x2="592.857" y2="526"/><g class="box lane"><rect x="659.286" y="16" width="112.857" height="34" rx="6"/><text x="715.714" y="33" style="font-size:13px">可灵</text></g><line class="life" x1="715.714" y1="50" x2="715.714" y2="526"/><g class="box lane"><rect x="782.143" y="16" width="112.857" height="34" rx="6"/><text x="838.571" y="33" style="font-size:13px">手机</text></g><line class="life" x1="838.571" y1="50" x2="838.571" y2="526"/><g class="num"><circle cx="18" cy="92" r="9"/><text x="18" y="96" text-anchor="middle">1</text></g><path class="" d="M101.429 92 L218.286 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="75.7771" y="74" width="174.16" height="18" rx="3"/><text class="lbl" x="162.857" y="85" text-anchor="middle" style="font-size:12px">电话里说「做一个 X 的视频」</text><g class="num"><circle cx="18" cy="134" r="9"/><text x="18" y="138" text-anchor="middle">2</text></g><path class="" d="M224.286 134 L341.143 134" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="152.794" y="116" width="265.84" height="18" rx="3"/><text class="lbl" x="285.714" y="127" text-anchor="middle" style="font-size:12px">转写 → /butler/understand,认成「做视频」</text><g class="num"><circle cx="18" cy="176" r="9"/><text x="18" y="180" text-anchor="middle">3</text></g><path class="" d="M347.143 176 L464 176" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="296.771" y="158" width="223.6" height="18" rx="3"/><text class="lbl" x="408.571" y="169" text-anchor="middle" style="font-size:12px">派豆包:开 App、找输入框、打字、发送</text><g class="num"><circle cx="18" cy="218" r="9"/><text x="18" y="222" text-anchor="middle">4</text></g><path class="" d="M470 218 L586.857 218" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="425.629" y="200" width="211.6" height="18" rx="3"/><text class="lbl" x="531.429" y="211" text-anchor="middle" style="font-size:12px">辅助功能送话(模式 = 它当时开着的)</text><g class="mark"><circle cx="651.229" cy="210" r="9"/><text x="651.229" y="214" text-anchor="middle">①</text></g><g class="num"><circle cx="18" cy="260" r="9"/><text x="18" y="264" text-anchor="middle">5</text></g><path class="dash" d="M592.857 260 L353.143 260" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="361.56" y="242" width="216.88" height="18" rx="3"/><text class="lbl" x="470" y="253" text-anchor="middle" style="font-size:12px">回话;接力链 3 秒一拍读本机缓存找图</text><g class="num"><circle cx="18" cy="302" r="9"/><text x="18" y="306" text-anchor="middle">6</text></g><path class="" d="M347.143 302 L464 302" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="274.211" y="284" width="268.72" height="18" rx="3"/><text class="lbl" x="408.571" y="295" text-anchor="middle" style="font-size:12px">开可灵:点页签、贴图、等图传完、写词、按生成</text><g class="num"><circle cx="18" cy="344" r="9"/><text x="18" y="348" text-anchor="middle">7</text></g><path class="" d="M470 344 L709.714 344" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="485.137" y="326" width="215.44" height="18" rx="3"/><text class="lbl" x="592.857" y="337" text-anchor="middle" style="font-size:12px">辅助功能操作:按名字找元素,固定等待</text><g class="mark"><circle cx="714.577" cy="336" r="9"/><text x="714.577" y="340" text-anchor="middle">②</text></g><g class="num"><circle cx="18" cy="386" r="9"/><text x="18" y="390" text-anchor="middle">8</text></g><path class="dash" d="M715.714 386 L353.143 386" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="397.069" y="368" width="268.72" height="18" rx="3"/><text class="lbl" x="531.429" y="379" text-anchor="middle" style="font-size:12px">判「进了生成」「做完」:日志、底部条、下载夹</text><g class="mark"><circle cx="679.789" cy="378" r="9"/><text x="679.789" y="382" text-anchor="middle">③</text></g><g class="num"><circle cx="18" cy="428" r="9"/><text x="18" y="432" text-anchor="middle">9</text></g><path class="" d="M347.143 428 L832.571 428" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="551.857" y="410" width="82" height="18" rx="3"/><text class="lbl" x="592.857" y="421" text-anchor="middle" style="font-size:12px">片子推到手机</text><g class="num"><circle cx="18" cy="470" r="9"/><text x="18" y="474" text-anchor="middle">10</text></g><path class="" d="M347.143 470 L230.286 470" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="182.554" y="452" width="206.32" height="18" rx="3"/><text class="lbl" x="285.714" y="463" text-anchor="middle" style="font-size:12px">来电台账 → 工人领 → 打电话告诉你</text><text class="note" x="40" y="550" text-anchor="start" style="font-size:12px">① 代码里没有一处选豆包的对话 / 工作模式,送进去的就是它当时开着的那个(现场多等 3 分钟)</text><text class="note" x="40" y="568" text-anchor="start" style="font-size:12px">② 可灵页面一改版,按名字找不到元素,链在这一步等到 20 分钟上限;现场 Codex 的适配没有回到源码</text><text class="note" x="40" y="586" text-anchor="start" style="font-size:12px">③ 10-14 做完没下载、读窗只回 30 行、取图太早,0.4.135–0.4.137 修了没复验</text></g></svg>