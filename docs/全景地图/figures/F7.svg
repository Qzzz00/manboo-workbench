<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 634" role="img" aria-label="时序:一通来电"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box lane"><rect x="45" y="16" width="133.333" height="34" rx="6"/><text x="111.667" y="33" style="font-size:13px">大脑 8791</text></g><line class="life" x1="111.667" y1="50" x2="111.667" y2="568"/><g class="box lane"><rect x="188.333" y="16" width="133.333" height="34" rx="6"/><text x="255" y="33" style="font-size:13px">通话工人</text></g><line class="life" x1="255" y1="50" x2="255" y2="568"/><g class="box lane"><rect x="331.667" y="16" width="133.333" height="34" rx="6"/><text x="398.333" y="33" style="font-size:13px">房间</text></g><line class="life" x1="398.333" y1="50" x2="398.333" y2="568"/><g class="box lane"><rect x="475" y="16" width="133.333" height="34" rx="6"/><text x="541.667" y="33" style="font-size:13px">手机</text></g><line class="life" x1="541.667" y1="50" x2="541.667" y2="568"/><g class="box lane"><rect x="618.333" y="16" width="133.333" height="34" rx="6"/><text x="685" y="33" style="font-size:13px">听筒</text></g><line class="life" x1="685" y1="50" x2="685" y2="568"/><g class="box lane"><rect x="761.667" y="16" width="133.333" height="34" rx="6"/><text x="828.333" y="33" style="font-size:13px">你</text></g><line class="life" x1="828.333" y1="50" x2="828.333" y2="568"/><g class="num"><circle cx="18" cy="92" r="9"/><text x="18" y="96" text-anchor="middle">1</text></g><path class="" d="M111.667 82 L145.667 82 L145.667 102 L117.667 102" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="152.667" y="85" width="218.32" height="18" rx="3"/><text class="lbl" x="261.827" y="96" text-anchor="middle" style="font-size:12px">派活失败 → 来电台账,1 秒一拍过规矩</text><g class="num"><circle cx="18" cy="134" r="9"/><text x="18" y="138" text-anchor="middle">2</text></g><path class="" d="M255 134 L117.667 134" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="45.8533" y="116" width="274.96" height="18" rx="3"/><text class="lbl" x="183.333" y="127" text-anchor="middle" style="font-size:12px">每 2 秒 /call/claim 领(房里要有手机或听筒)</text><g class="num"><circle cx="18" cy="176" r="9"/><text x="18" y="180" text-anchor="middle">3</text></g><path class="" d="M255 176 L392.333 176" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="264.067" y="158" width="125.2" height="18" rx="3"/><text class="lbl" x="326.667" y="169" text-anchor="middle" style="font-size:12px">广播 ring,计 60 秒</text><g class="num"><circle cx="18" cy="218" r="9"/><text x="18" y="222" text-anchor="middle">4</text></g><path class="" d="M398.333 218 L535.667 218" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="394.2" y="200" width="151.6" height="18" rx="3"/><text class="lbl" x="470" y="211" text-anchor="middle" style="font-size:12px">手机响(原生铃 / 网页铃)</text><g class="num"><circle cx="18" cy="260" r="9"/><text x="18" y="264" text-anchor="middle">5</text></g><path class="" d="M398.333 260 L679 260" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="449.307" y="242" width="184.72" height="18" rx="3"/><text class="lbl" x="541.667" y="253" text-anchor="middle" style="font-size:12px">听筒只进入「可提机」,自己不响</text><g class="mark"><circle cx="648.027" cy="252" r="9"/><text x="648.027" y="256" text-anchor="middle">①</text></g><g class="num"><circle cx="18" cy="302" r="9"/><text x="18" y="306" text-anchor="middle">6</text></g><path class="" d="M828.333 302 L547.667 302" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="601.28" y="284" width="167.44" height="18" rx="3"/><text class="lbl" x="685" y="295" text-anchor="middle" style="font-size:12px">接起:先接先得,谁接的谁出声</text><g class="num"><circle cx="18" cy="344" r="9"/><text x="18" y="348" text-anchor="middle">7</text></g><path class="" d="M255 344 L822.333 344" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="435.147" y="326" width="213.04" height="18" rx="3"/><text class="lbl" x="541.667" y="337" text-anchor="middle" style="font-size:12px">开场白:模板拼,不经模型,最长 42 字</text><g class="num"><circle cx="18" cy="386" r="9"/><text x="18" y="390" text-anchor="middle">8</text></g><path class="" d="M828.333 386 L261 386" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="430.347" y="368" width="222.64" height="18" rx="3"/><text class="lbl" x="541.667" y="379" text-anchor="middle" style="font-size:12px">说一句 → 火山识别 → 听懂(400 毫秒)</text><g class="num"><circle cx="18" cy="428" r="9"/><text x="18" y="432" text-anchor="middle">9</text></g><path class="" d="M255 428 L117.667 428" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="59.7733" y="410" width="247.12" height="18" rx="3"/><text class="lbl" x="183.333" y="421" text-anchor="middle" style="font-size:12px">工具 wb_decide_item → 当场再派 / 挪卡</text><g class="num"><circle cx="18" cy="470" r="9"/><text x="18" y="474" text-anchor="middle">10</text></g><path class="" d="M255 470 L822.333 470" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="479.307" y="452" width="124.72" height="18" rx="3"/><text class="lbl" x="541.667" y="463" text-anchor="middle" style="font-size:12px">合成说出来;道别即挂</text><g class="num"><circle cx="18" cy="512" r="9"/><text x="18" y="516" text-anchor="middle">11</text></g><path class="" d="M541.667 512 L117.667 512" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="194.707" y="494" width="263.92" height="18" rx="3"/><text class="lbl" x="326.667" y="505" text-anchor="middle" style="font-size:12px">同call_id → 通话记录与行为账,不因通话建卡</text><g class="mark"><circle cx="472.627" cy="504" r="9"/><text x="472.627" y="508" text-anchor="middle">②</text></g><text class="note" x="40" y="592" text-anchor="start" style="font-size:12px">① 领电话只看身份前缀,听筒也是这个前缀:房里只有听筒没手机时,电话被领走却没东西响,60 秒后记未接(没真机验)</text><text class="note" x="40" y="610" text-anchor="start" style="font-size:12px">② 手机/工人同call_id合成一份记录;App被划掉后的接线与记录中断仍需实测,没有推送</text></g></svg>