<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 466" role="img" aria-label="时序:出门时手机找电脑"><rect width="100%" height="100%" fill="#fff"/><style>
text{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif}
.zone rect{fill:none;stroke:#9a9a9a;stroke-width:.6}.zone text{fill:#777;font-size:12px}
.box rect{fill:#fff;stroke:#8a8a8a;stroke-width:.8}.box text{fill:#222;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.box text.sub{fill:#555;font-size:12px;font-weight:400}.box.brain rect{fill:#fbf6e6;stroke:#b8962e;stroke-width:1.2}
.box.entry rect{stroke:#666}.box.todo rect{stroke-dasharray:5 4}.box.lane rect{fill:#eee}
line.life{stroke:#aaa;stroke-dasharray:3 4;stroke-width:1}.num circle{fill:#eee;stroke:#999;stroke-width:.8}.num text{fill:#555;font-size:11px}
.mark circle{fill:#fff3d0;stroke:#b8962e;stroke-width:1}.mark text{fill:#8a6d1a;font-size:11px}
text.lbl{fill:#222}rect.lblbg{fill:#fff}text.note{fill:#8a6d1a}text.sub{fill:#555}
.arrows line,.arrows path{fill:none;stroke:#444;stroke-width:1.2}.arrows .dash{stroke-dasharray:4 3}.arrows .dot{stroke-dasharray:1.5 3}
.arrows .thick{stroke-width:2.6}.arrows .ble{stroke-dasharray:6 3 1.5 3}
marker path.mk{stroke:#444}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="arrows"><g class="box lane"><rect x="51" y="16" width="150" height="34" rx="6"/><text x="126" y="33" style="font-size:13px">手机</text></g><line class="life" x1="126" y1="50" x2="126" y2="400"/><g class="box lane"><rect x="223" y="16" width="150" height="34" rx="6"/><text x="298" y="33" style="font-size:13px">局域网 8791</text></g><line class="life" x1="298" y1="50" x2="298" y2="400"/><g class="box lane"><rect x="395" y="16" width="150" height="34" rx="6"/><text x="470" y="33" style="font-size:13px">云上房间</text></g><line class="life" x1="470" y1="50" x2="470" y2="400"/><g class="box lane"><rect x="567" y="16" width="150" height="34" rx="6"/><text x="642" y="33" style="font-size:13px">通话工人</text></g><line class="life" x1="642" y1="50" x2="642" y2="400"/><g class="box lane"><rect x="739" y="16" width="150" height="34" rx="6"/><text x="814" y="33" style="font-size:13px">大脑 8791</text></g><line class="life" x1="814" y1="50" x2="814" y2="400"/><g class="num"><circle cx="18" cy="92" r="9"/><text x="18" y="96" text-anchor="middle">1</text></g><path class="" d="M126 92 L292 92" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="94.68" y="74" width="234.64" height="18" rx="3"/><text class="lbl" x="212" y="85" text-anchor="middle" style="font-size:12px">直连试 1.2 秒(刚开 App 或网络刚变时)</text><g class="num"><circle cx="18" cy="134" r="9"/><text x="18" y="138" text-anchor="middle">2</text></g><path class="dash" d="M126 134 L464 134" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="182.12" y="116" width="231.76" height="18" rx="3"/><text class="lbl" x="298" y="127" text-anchor="middle" style="font-size:12px">同时把请求发进房间 wb.rpc,谁先通用谁</text><g class="num"><circle cx="18" cy="176" r="9"/><text x="18" y="180" text-anchor="middle">3</text></g><path class="dash" d="M470 176 L636 176" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="463.64" y="158" width="184.72" height="18" rx="3"/><text class="lbl" x="556" y="169" text-anchor="middle" style="font-size:12px">工人收到,按那台手机的身份降权</text><g class="num"><circle cx="18" cy="218" r="9"/><text x="18" y="222" text-anchor="middle">4</text></g><path class="" d="M642 218 L808 218" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="633.48" y="200" width="189.04" height="18" rx="3"/><text class="lbl" x="728" y="211" text-anchor="middle" style="font-size:12px">替手机打 8791(白名单内的路由)</text><g class="num"><circle cx="18" cy="260" r="9"/><text x="18" y="264" text-anchor="middle">5</text></g><path class="" d="M814 260 L648 260" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="711" y="242" width="34" height="18" rx="3"/><text class="lbl" x="728" y="253" text-anchor="middle" style="font-size:12px">回包</text><g class="num"><circle cx="18" cy="302" r="9"/><text x="18" y="306" text-anchor="middle">6</text></g><path class="dash" d="M642 302 L476 302" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="509" y="284" width="94" height="18" rx="3"/><text class="lbl" x="556" y="295" text-anchor="middle" style="font-size:12px">经房间回给手机</text><g class="num"><circle cx="18" cy="344" r="9"/><text x="18" y="348" text-anchor="middle">7</text></g><path class="dash" d="M470 344 L132 344" fill="none" marker-end="url(#arr)"/><rect class="lblbg" x="204.2" y="326" width="187.6" height="18" rx="3"/><text class="lbl" x="298" y="337" text-anchor="middle" style="font-size:12px">手机拿到;每 30 秒再试一次直连</text><text class="note" x="40" y="424" text-anchor="start" style="font-size:12px">出门能做:看、交代、按住说话、打电话、答问 / 批准 / 验收、开会、取文件;不能:推送、横屏展示台、朗读、单人播客、现搜资讯、扫码配对</text><text class="note" x="40" y="442" text-anchor="start" style="font-size:12px">10-21 拍板:主路改回局域网,云上房间与中转退为备路</text></g></svg>