<!doctype html><html><head><meta charset="utf-8"><title>卡上的小头像会不会被切</title>
<script>
const mm = window.matchMedia.bind(window)
window.matchMedia = q => String(q).includes('prefers-reduced-motion')
  ? { matches: false, media: String(q), onchange: null, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {}, dispatchEvent: () => false }
  : mm(q)
</script>
