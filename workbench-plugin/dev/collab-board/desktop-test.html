<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协作区桌面验收(1024)</title>
  <style>html,body{margin:0;height:100%;background:#0b0b0c}#app{position:relative;height:100vh}</style>
</head>
<body>
  <div id="app"></div>
  <script>window.__errs=[];window.addEventListener('error',e=>window.__errs.push(String(e.message||e.error)));window.addEventListener('unhandledrejection',e=>window.__errs.push('promise:'+String(e.reason)))</script>
  <script type="module" src="./desktop-main.tsx"></script>
</body>
</html>
