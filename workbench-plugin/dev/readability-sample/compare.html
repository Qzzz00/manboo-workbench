<!doctype html><html><head><meta charset="utf-8"><title>工作台可读性 · 对照</title>
<!--
  并排对照的拼图页,由 shoot.sh 调。每一栏一组参数,按出现顺序排:
    i=<图片地址>  t=<标题>  s=<小字>
  ?theme=dark 换深色底。图片是两倍像素截的,这里按一半宽摆(img 读到尺寸后自己定)。
-->
<style>
html,body{margin:0;background:#8a8a8a;font:600 22px/1.3 -apple-system,"PingFang SC",sans-serif;color:#111}
body[data-dark]{background:#3a3a3a;color:#f2f2f2}
.row{display:flex;gap:24px;padding:16px;align-items:flex-start;width:max-content}
.col{display:flex;flex-direction:column;gap:8px}
.col b{padding-left:4px}
.col span{font-weight:400;font-size:15px;opacity:.8;margin-left:12px}
img{display:block}
</style></head>
<body>
<div class="row" id="row"></div>
<script>
const q = new URLSearchParams(location.search)
if (q.get('theme') === 'dark') document.body.setAttribute('data-dark', '')
const imgs = q.getAll('i'), titles = q.getAll('t'), subs = q.getAll('s')
const row = document.getElementById('row')
imgs.forEach((src, at) => {
  const col = document.createElement('div')
  col.className = 'col'
  const head = document.createElement('b')
  head.textContent = titles[at] ?? ''
  if (subs[at]) { const sub = document.createElement('span'); sub.textContent = subs[at]; head.appendChild(sub) }
  const img = document.createElement('img')
  img.onload = () => { img.style.width = `${img.naturalWidth / 2}px` }
  img.src = src
  col.append(head, img)
  row.appendChild(col)
})
</script>
</body></html>
